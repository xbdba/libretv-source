name: Update LibreTV sources

on:
  push:
    paths:
      - '.github/workflows/update-sources.yml'
      - 'config/sources.json'
      - 'scripts/**'
      - 'tests/**'
  schedule:
    - cron: '17 19 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-libretv-sources
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test reviewed-source policy
        run: npm test

      - name: Build and probe reviewed sources
        run: npm run build

      - name: Validate generated subscription
        run: |
          node --input-type=module -e "
            import fs from 'node:fs';
            const cfg = JSON.parse(fs.readFileSync('config/sources.json', 'utf8'));
            const data = JSON.parse(fs.readFileSync('dist/libretv-sources.json', 'utf8'));
            if (data.version !== 2) throw new Error('version must be 2');
            if (data.quality?.selectionMode !== 'reviewed-only') throw new Error('quality mode must be reviewed-only');
            if (!Array.isArray(data.sources) || data.sources.length < cfg.minSources) throw new Error('not enough reviewed vod sources');
            if (!Array.isArray(data.liveSources) || data.liveSources.length < cfg.minLiveSources) throw new Error('not enough reviewed live sources');
            console.log('vod=' + data.sources.length + ' live=' + data.liveSources.length);
          "

      - name: Commit updated file
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/libretv-sources.json
          if git diff --cached --quiet; then
            echo 'No change'
            exit 0
          fi
          git commit -m "chore: update LibreTV sources $(date -u +%F)"
          git push
